name: ci

# Trigger model:
#   - PR-driven only. Every PR targeting main or develop runs the full pipeline.
#   - PR develop -> main runs all 8 checks including e2e and discord-live (MainSecure ruleset).
#   - PR feature -> develop runs the 6 cheap checks (DevelopSecure ruleset).
#   - No push triggers: post-merge re-runs would re-test the exact same code state
#     under squash-merge semantics (identical tree hash). The ruleset already enforces
#     a green pipeline on the PR head before allowing the merge.
#
# Each job delegates to the corresponding docker-compose.test.yml service.
# Same compose command runs locally and in CI — no drift between environments.
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write          # required by dorny/test-reporter (Tasks 5, 6)
  security-events: write # required by github/codeql-action/upload-sarif (Task 7)
  pull-requests: write   # required by marocchino/sticky-pull-request-comment (Plan 0.8.6 Task 2)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend-tests:
    name: backend (lint + unit + integration + security)
    runs-on: [self-hosted, linux, dotnet10]
    needs: [openapi-drift]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Prepare workspace mountpoints
        run: sh deploy/test-runners/prep-workspace.sh
      - name: Prepare shared-results dir
        run: |
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          mkdir -p "$SHARED/backend"
          echo "TEST_RESULTS_DIR=$SHARED" >> $GITHUB_ENV
          echo "shared-results dir: $SHARED"
      - name: Run via docker compose
        run: docker compose -f deploy/compose/docker-compose.test.yml run --build --rm backend-tests
      - name: Publish backend test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: backend tests
          path: ${{ env.TEST_RESULTS_DIR }}/backend/*.trx
          reporter: dotnet-trx
          # The docker compose step already fails the job on test failure;
          # this step is annotation-only. fail-on-error: false prevents
          # double-failure noise.
          fail-on-error: false

  frontend-tests:
    name: frontend (lint + typecheck + vitest + build)
    runs-on: [self-hosted, linux, dotnet10]
    needs: [backend-tests]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Prepare workspace mountpoints
        run: sh deploy/test-runners/prep-workspace.sh
      - name: Prepare shared-results dir
        run: |
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          mkdir -p "$SHARED/frontend"
          echo "TEST_RESULTS_DIR=$SHARED" >> $GITHUB_ENV
          echo "shared-results dir: $SHARED"
      - name: Run via docker compose
        run: docker compose -f deploy/compose/docker-compose.test.yml run --build --rm frontend-tests
      - name: Publish frontend test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: frontend tests
          path: ${{ env.TEST_RESULTS_DIR }}/frontend/vitest.xml
          reporter: jest-junit
          fail-on-error: false

  openapi-drift:
    name: OpenAPI + generated client drift
    runs-on: [self-hosted, linux, dotnet10]
    needs: [sql-tenant-filter]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Prepare workspace mountpoints
        run: sh deploy/test-runners/prep-workspace.sh
      - name: Prepare shared-results dir
        run: |
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          mkdir -p "$SHARED/openapi"
          echo "TEST_RESULTS_DIR=$SHARED" >> $GITHUB_ENV
          echo "shared-results dir: $SHARED"
      - name: Run via docker compose
        run: docker compose -f deploy/compose/docker-compose.test.yml run --build --rm openapi-drift

  sql-tenant-filter:
    name: SQL tenant_id lint
    runs-on: [self-hosted, linux, dotnet10]
    needs: [security]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Prepare workspace mountpoints
        run: sh deploy/test-runners/prep-workspace.sh
      - name: Prepare shared-results dir
        run: |
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          mkdir -p "$SHARED/sql-tenant-filter"
          echo "TEST_RESULTS_DIR=$SHARED" >> $GITHUB_ENV
          echo "shared-results dir: $SHARED"
      - name: Run via docker compose
        run: docker compose -f deploy/compose/docker-compose.test.yml run --build --rm sql-tenant-filter

  security:
    name: security (pnpm audit + dotnet vulnerable + trivy)
    runs-on: [self-hosted, linux, dotnet10]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Prepare workspace mountpoints
        run: sh deploy/test-runners/prep-workspace.sh
      - name: Prepare shared-results dir
        run: |
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          mkdir -p "$SHARED/security"
          echo "TEST_RESULTS_DIR=$SHARED" >> $GITHUB_ENV
          echo "shared-results dir: $SHARED"
      - name: Run via docker compose
        run: docker compose -f deploy/compose/docker-compose.test.yml run --build --rm security
      - name: Upload Trivy SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.TEST_RESULTS_DIR }}/security/trivy.sarif
          category: trivy

  container-smoke:
    name: container build smoke (api + web)
    runs-on: [self-hosted, linux, dotnet10]
    needs: [frontend-tests]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Prepare workspace mountpoints
        run: sh deploy/test-runners/prep-workspace.sh
      - name: Prepare shared-results dir
        run: |
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          mkdir -p "$SHARED/container-smoke"
          echo "TEST_RESULTS_DIR=$SHARED" >> $GITHUB_ENV
          echo "shared-results dir: $SHARED"
      - name: Run via docker compose
        run: docker compose -f deploy/compose/docker-compose.test.yml run --build --rm container-smoke

  e2e-tests:
    name: e2e smoke (Playwright via compose)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: [self-hosted, linux, dotnet10]
    needs: [container-smoke]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Prepare workspace mountpoints
        run: sh deploy/test-runners/prep-workspace.sh
      - name: Prepare shared-results dir
        run: |
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          mkdir -p "$SHARED/e2e"
          echo "TEST_RESULTS_DIR=$SHARED" >> $GITHUB_ENV
          echo "shared-results dir: $SHARED"
      - name: Run via docker compose
        env:
          HOST_REPO_ROOT: ${{ github.workspace }}
        run: docker compose -f deploy/compose/docker-compose.test.yml run --build --rm e2e-tests

  discord-live-tests:
    name: Discord live tests
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: [self-hosted, linux, dotnet10]
    needs: [container-smoke]
    timeout-minutes: 10
    concurrency:
      group: discord-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Materialize discord.dev.env
        env:
          TOKEN: ${{ secrets.DISCORD_DEV_BOT_TOKEN }}
          GUILD_ID: ${{ secrets.DISCORD_DEV_GUILD_ID }}
          CHANNEL_ID: ${{ secrets.DISCORD_DEV_CHANNEL_ID }}
        shell: bash
        run: |
          if [ -z "$TOKEN" ] || [ -z "$GUILD_ID" ]; then
            echo "::notice::Discord live tests skipped — DISCORD_DEV_BOT_TOKEN / DISCORD_DEV_GUILD_ID not set in repo secrets"
            exit 0
          fi
          # Gateway tests (DiscordNetBotConnectionLiveTests) only need TOKEN + GUILD_ID.
          # REST tests (DiscordRestChannelClientLiveTests) additionally need CHANNEL_ID
          # and exercise the full webhook lifecycle (create -> send -> edit -> delete).
          # If CHANNEL_ID is missing the REST tests skip but gateway tests still run.
          {
            printf '%s=%s\n' DISCORD_DEV_BOT_TOKEN "$TOKEN"
            printf '%s=%s\n' DISCORD_DEV_GUILD_ID "$GUILD_ID"
            if [ -n "$CHANNEL_ID" ]; then
              printf '%s=%s\n' DISCORD_DEV_CHANNEL_ID "$CHANNEL_ID"
            else
              echo "::warning::DISCORD_DEV_CHANNEL_ID not set in repo secrets — REST webhook lifecycle tests will skip" >&2
            fi
          } > deploy/compose/discord.dev.env
      - name: Prepare workspace mountpoints
        run: sh deploy/test-runners/prep-workspace.sh
      - name: Prepare shared-results dir
        run: |
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          mkdir -p "$SHARED/discord-live"
          echo "TEST_RESULTS_DIR=$SHARED" >> $GITHUB_ENV
          echo "shared-results dir: $SHARED"
      - name: Run via docker compose
        run: docker compose -f deploy/compose/docker-compose.test.yml run --build --rm discord-live-tests
      - name: Cleanup discord.dev.env
        if: always()
        shell: bash
        run: rm -f deploy/compose/discord.dev.env

  discord-roundtrip-tests:
    name: Discord round-trip tests
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: [self-hosted, linux, dotnet10]
    # Round-trip relies on a working bot connection. discord-live-tests
    # verifies the gateway connect and REST reachability against the same
    # secrets first — if that's broken, round-trip has nothing to verify
    # against and would just burn Discord rate-limits.
    needs: [container-smoke, discord-live-tests]
    timeout-minutes: 15
    concurrency:
      # Same bot, so we don't want two jobs hammering it in parallel. needs:
      # above already serialises with discord-live-tests; the group here
      # avoids two PRs against main from running round-trip simultaneously.
      group: discord-roundtrip
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Materialize discord.dev.env
        env:
          TOKEN: ${{ secrets.DISCORD_DEV_BOT_TOKEN }}
          GUILD_ID: ${{ secrets.DISCORD_DEV_GUILD_ID }}
          CHANNEL_ID: ${{ secrets.DISCORD_DEV_CHANNEL_ID }}
        shell: bash
        run: |
          if [ -z "$TOKEN" ] || [ -z "$GUILD_ID" ] || [ -z "$CHANNEL_ID" ]; then
            echo "::notice::Discord round-trip tests skipped — DISCORD_DEV_BOT_TOKEN / DISCORD_DEV_GUILD_ID / DISCORD_DEV_CHANNEL_ID not all set in repo secrets"
            exit 0
          fi
          {
            printf '%s=%s\n' DISCORD_DEV_BOT_TOKEN "$TOKEN"
            printf '%s=%s\n' DISCORD_DEV_GUILD_ID "$GUILD_ID"
            printf '%s=%s\n' DISCORD_DEV_CHANNEL_ID "$CHANNEL_ID"
          } > deploy/compose/discord.dev.env
      - name: Prepare workspace mountpoints
        run: sh deploy/test-runners/prep-workspace.sh
      - name: Prepare shared-results dir
        run: |
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          mkdir -p "$SHARED/discord-roundtrip"
          echo "TEST_RESULTS_DIR=$SHARED" >> $GITHUB_ENV
          echo "shared-results dir: $SHARED"
      - name: Run via docker compose
        run: docker compose -f deploy/compose/docker-compose.test.yml run --build --rm discord-roundtrip-tests
      - name: Cleanup discord.dev.env
        if: always()
        shell: bash
        run: rm -f deploy/compose/discord.dev.env

  summary:
    name: PR test summary
    # Include e2e-tests, discord-live-tests and discord-roundtrip-tests so their
    # results land in the sticky comment when the PR targets main. On PR->develop
    # all three have if-conditions that resolve to false, so they finish in the
    # "skipped" state immediately — `needs:` treats skipped as resolved.
    # `if: always()` on the summary itself means it still runs even when an
    # upstream job failed or was skipped.
    needs:
      - security
      - sql-tenant-filter
      - openapi-drift
      - backend-tests
      - frontend-tests
      - container-smoke
      - e2e-tests
      - discord-live-tests
      - discord-roundtrip-tests
    if: always()
    runs-on: [self-hosted, linux, dotnet10]
    timeout-minutes: 5
    steps:
      - name: Stage shared results into workspace
        run: |
          # Plan 0.8.5: read test results from the host-shared path each
          # test-producing job wrote to. No download-artifact — nothing was uploaded.
          #
          # Plan 0.8.6: render-test-summary.py runs directly on the runner (not
          # inside a docker container), so it can access any path. We still copy
          # into .staged-results/ so the renderer has a single, clean root to
          # walk, and the cleanup step removes it afterwards.
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          STAGED="${{ github.workspace }}/.staged-results"
          mkdir -p "$STAGED"
          if [ -d "$SHARED" ] && [ -n "$(ls -A "$SHARED" 2>/dev/null)" ]; then
              cp -r "$SHARED"/* "$STAGED/"
              echo "staged-results contents:"
              find "$STAGED" -maxdepth 2 -type f \( -name '*.trx' -o -name '*.xml' \) | head -30
          else
              echo "(no shared-results dir or empty — all upstream jobs may have failed/skipped before writing)"
          fi
      - name: Render markdown summary
        id: summary
        if: always()
        run: |
          # Plan 0.8.6: run the renderer over the staged test results.
          # Exit code mirrors test outcome (0 pass, 1 any-fail), so this
          # step itself fails when tests fail — that bubbles up as the
          # summary job's status.
          python3 tools/render-test-summary.py .staged-results > /tmp/dwbhub-summary.md
          STATUS=$?
          # Stream the markdown to the workflow log so it's visible in the
          # runner UI alongside the comment.
          cat /tmp/dwbhub-summary.md
          # Capture the markdown as a step output for the next step.
          {
            echo 'markdown<<__EOF_SUMMARY__'
            cat /tmp/dwbhub-summary.md
            echo '__EOF_SUMMARY__'
          } >> "$GITHUB_OUTPUT"
          exit $STATUS
      - name: Post sticky PR comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          # Header tag matches the HTML marker in the rendered markdown so
          # marocchino finds and updates the same comment on every re-run
          # instead of posting a new one each time.
          header: DWBHUB_TEST_SUMMARY
          message: ${{ steps.summary.outputs.markdown }}
      - name: Cleanup shared-results host path + staged copy
        if: always()
        run: |
          # Remove the run-scoped shared-results dir on the host (was sourced by Stage).
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          if [ -d "$SHARED" ]; then
              rm -rf "$SHARED"
              echo "Cleaned up host shared-results: $SHARED"
          fi
          # Remove the staged copy from the workspace.
          STAGED="${{ github.workspace }}/.staged-results"
          if [ -d "$STAGED" ]; then
              rm -rf "$STAGED"
              echo "Cleaned up workspace staged-results: $STAGED"
          fi
          # Opportunistically clean any orphan shared-results dirs older than
          # 24 hours (catches workflows that aborted before reaching summary).
          PARENT="$(realpath ${{ github.workspace }}/..)/shared-results"
          if [ -d "$PARENT" ]; then
              find "$PARENT" -mindepth 1 -maxdepth 1 -type d -mtime +1 -exec rm -rf {} \; 2>/dev/null || true
          fi
