name: ci

# Trigger model:
#   - PR-driven only. Every PR targeting main or develop runs the full pipeline.
#   - PR develop -> main runs all 8 checks including e2e and discord-live (MainSecure ruleset).
#   - PR feature -> develop runs the 6 cheap checks (DevelopSecure ruleset).
#   - No push triggers: post-merge re-runs would re-test the exact same code state
#     under squash-merge semantics (identical tree hash). The ruleset already enforces
#     a green pipeline on the PR head before allowing the merge.
#
# Each job delegates to the corresponding docker-compose.test.yml service.
# Same compose command runs locally and in CI — no drift between environments.
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write          # required by dorny/test-reporter (Tasks 5, 6)
  security-events: write # required by github/codeql-action/upload-sarif (Task 7)
  pull-requests: write   # required by EnricoMi/publish-unit-test-result-action sticky comment (Task 8)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend-tests:
    name: backend (lint + unit + integration + security)
    runs-on: [self-hosted, linux, dotnet10]
    needs: [openapi-drift]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Prepare workspace mountpoints
        run: sh deploy/test-runners/prep-workspace.sh
      - name: Prepare shared-results dir
        run: |
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          mkdir -p "$SHARED/backend"
          echo "TEST_RESULTS_DIR=$SHARED" >> $GITHUB_ENV
          echo "shared-results dir: $SHARED"
      - name: Run via docker compose
        run: docker compose -f deploy/compose/docker-compose.test.yml run --build --rm backend-tests
      - name: Publish backend test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: backend tests
          path: ${{ env.TEST_RESULTS_DIR }}/backend/*.trx
          reporter: dotnet-trx
          # The docker compose step already fails the job on test failure;
          # this step is annotation-only. fail-on-error: false prevents
          # double-failure noise.
          fail-on-error: false

  frontend-tests:
    name: frontend (lint + typecheck + vitest + build)
    runs-on: [self-hosted, linux, dotnet10]
    needs: [backend-tests]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Prepare workspace mountpoints
        run: sh deploy/test-runners/prep-workspace.sh
      - name: Prepare shared-results dir
        run: |
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          mkdir -p "$SHARED/frontend"
          echo "TEST_RESULTS_DIR=$SHARED" >> $GITHUB_ENV
          echo "shared-results dir: $SHARED"
      - name: Run via docker compose
        run: docker compose -f deploy/compose/docker-compose.test.yml run --build --rm frontend-tests
      - name: Publish frontend test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: frontend tests
          path: ${{ env.TEST_RESULTS_DIR }}/frontend/vitest.xml
          reporter: jest-junit
          fail-on-error: false

  openapi-drift:
    name: OpenAPI + generated client drift
    runs-on: [self-hosted, linux, dotnet10]
    needs: [sql-tenant-filter]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Prepare workspace mountpoints
        run: sh deploy/test-runners/prep-workspace.sh
      - name: Prepare shared-results dir
        run: |
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          mkdir -p "$SHARED/openapi"
          echo "TEST_RESULTS_DIR=$SHARED" >> $GITHUB_ENV
          echo "shared-results dir: $SHARED"
      - name: Run via docker compose
        run: docker compose -f deploy/compose/docker-compose.test.yml run --build --rm openapi-drift

  sql-tenant-filter:
    name: SQL tenant_id lint
    runs-on: [self-hosted, linux, dotnet10]
    needs: [security]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Prepare workspace mountpoints
        run: sh deploy/test-runners/prep-workspace.sh
      - name: Prepare shared-results dir
        run: |
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          mkdir -p "$SHARED/sql-tenant-filter"
          echo "TEST_RESULTS_DIR=$SHARED" >> $GITHUB_ENV
          echo "shared-results dir: $SHARED"
      - name: Run via docker compose
        run: docker compose -f deploy/compose/docker-compose.test.yml run --build --rm sql-tenant-filter

  security:
    name: security (pnpm audit + dotnet vulnerable + trivy)
    runs-on: [self-hosted, linux, dotnet10]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Prepare workspace mountpoints
        run: sh deploy/test-runners/prep-workspace.sh
      - name: Prepare shared-results dir
        run: |
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          mkdir -p "$SHARED/security"
          echo "TEST_RESULTS_DIR=$SHARED" >> $GITHUB_ENV
          echo "shared-results dir: $SHARED"
      - name: Run via docker compose
        run: docker compose -f deploy/compose/docker-compose.test.yml run --build --rm security
      - name: Upload Trivy SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.TEST_RESULTS_DIR }}/security/trivy.sarif
          category: trivy

  container-smoke:
    name: container build smoke (api + web)
    runs-on: [self-hosted, linux, dotnet10]
    needs: [frontend-tests]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Prepare workspace mountpoints
        run: sh deploy/test-runners/prep-workspace.sh
      - name: Prepare shared-results dir
        run: |
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          mkdir -p "$SHARED/container-smoke"
          echo "TEST_RESULTS_DIR=$SHARED" >> $GITHUB_ENV
          echo "shared-results dir: $SHARED"
      - name: Run via docker compose
        run: docker compose -f deploy/compose/docker-compose.test.yml run --build --rm container-smoke

  e2e-tests:
    name: e2e smoke (Playwright via compose)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: [self-hosted, linux, dotnet10]
    needs: [container-smoke]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Prepare workspace mountpoints
        run: sh deploy/test-runners/prep-workspace.sh
      - name: Prepare shared-results dir
        run: |
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          mkdir -p "$SHARED/e2e"
          echo "TEST_RESULTS_DIR=$SHARED" >> $GITHUB_ENV
          echo "shared-results dir: $SHARED"
      - name: Run via docker compose
        env:
          HOST_REPO_ROOT: ${{ github.workspace }}
        run: docker compose -f deploy/compose/docker-compose.test.yml run --build --rm e2e-tests

  discord-live-tests:
    name: Discord live tests
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: [self-hosted, linux, dotnet10]
    needs: [container-smoke]
    timeout-minutes: 10
    concurrency:
      group: discord-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Materialize discord.dev.env
        env:
          TOKEN: ${{ secrets.DISCORD_DEV_BOT_TOKEN }}
          GUILD_ID: ${{ secrets.DISCORD_DEV_GUILD_ID }}
        shell: bash
        run: |
          if [ -z "$TOKEN" ] || [ -z "$GUILD_ID" ]; then
            echo "::notice::Discord live tests skipped — DISCORD_DEV_BOT_TOKEN / DISCORD_DEV_GUILD_ID not set in repo secrets"
            exit 0
          fi
          printf '%s=%s\n%s=%s\n' DISCORD_DEV_BOT_TOKEN "$TOKEN" DISCORD_DEV_GUILD_ID "$GUILD_ID" > deploy/compose/discord.dev.env
      - name: Prepare workspace mountpoints
        run: sh deploy/test-runners/prep-workspace.sh
      - name: Prepare shared-results dir
        run: |
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          mkdir -p "$SHARED/discord-live"
          echo "TEST_RESULTS_DIR=$SHARED" >> $GITHUB_ENV
          echo "shared-results dir: $SHARED"
      - name: Run via docker compose
        run: docker compose -f deploy/compose/docker-compose.test.yml run --build --rm discord-live-tests
      - name: Cleanup discord.dev.env
        if: always()
        shell: bash
        run: rm -f deploy/compose/discord.dev.env

  summary:
    name: PR test summary
    # Include e2e-tests and discord-live-tests so their results land in the
    # sticky comment when the PR targets main. On PR->develop both have
    # if-conditions that resolve to false, so they finish in the "skipped"
    # state immediately — `needs:` treats skipped as resolved, so the
    # summary doesn't wait long. `if: always()` on the summary itself means
    # it still runs even when an upstream job failed or was skipped.
    needs:
      - security
      - sql-tenant-filter
      - openapi-drift
      - backend-tests
      - frontend-tests
      - container-smoke
      - e2e-tests
      - discord-live-tests
    if: always()
    runs-on: [self-hosted, linux, dotnet10]
    timeout-minutes: 5
    steps:
      - name: Stage shared results for EnricoMi
        run: |
          # Plan 0.8.5: read test results from the host-shared path each
          # test-producing job wrote to. No download-artifact — nothing was uploaded.
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          echo "SHARED_RESULTS=$SHARED" >> $GITHUB_ENV
          if [ -d "$SHARED" ]; then
              echo "shared-results contents:"
              find "$SHARED" -maxdepth 2 -type f \( -name '*.trx' -o -name '*.xml' \) | head -30
          else
              echo "(no shared-results dir — all upstream jobs may have failed before writing)"
          fi
      - name: Publish consolidated test summary
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          # File patterns by source job:
          #   *.trx          backend-tests (unit/integration/security)
          #                  + discord-live-tests (when it runs on PR->main)
          #   vitest.xml     frontend-tests (Vitest JUnit reporter)
          #   playwright.xml e2e-tests (Playwright JUnit reporter, PR->main)
          # EnricoMi auto-detects the format per file. Jobs that didn't write
          # results (e.g. e2e/discord on PR->develop where those jobs skip)
          # are silently ignored — the same glob covers both PR targets.
          files: |
            ${{ env.SHARED_RESULTS }}/**/*.trx
            ${{ env.SHARED_RESULTS }}/**/vitest.xml
            ${{ env.SHARED_RESULTS }}/**/playwright.xml
          check_name: "Test Results"
          # 'always' creates the sticky comment on first run and UPDATES it
          # on every subsequent run of the same PR — one comment per PR,
          # never spam.
          comment_mode: always
          report_individual_runs: true
      - name: Cleanup shared-results host path
        if: always()
        run: |
          SHARED="$(realpath ${{ github.workspace }}/..)/shared-results/${{ github.run_id }}"
          if [ -d "$SHARED" ]; then
              rm -rf "$SHARED"
              echo "Cleaned up: $SHARED"
          fi
          # Opportunistically clean any orphan shared-results dirs older than
          # 24 hours (catches workflows that aborted before reaching summary).
          PARENT="$(realpath ${{ github.workspace }}/..)/shared-results"
          if [ -d "$PARENT" ]; then
              find "$PARENT" -mindepth 1 -maxdepth 1 -type d -mtime +1 -exec rm -rf {} \; 2>/dev/null || true
          fi
