worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;

    # Writable paths for unprivileged operation.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip           on;
    gzip_vary      on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Docker's embedded DNS so nginx can defer api/* lookups until request
        # time. Without this, an upstream {} block or a plain hostname in
        # proxy_pass forces resolution at startup — which crashes the web
        # container in standalone smoke-tests (no api service in the network).
        # ipv6=off because the embedded resolver only speaks IPv4 reliably.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Cache fingerprinted assets aggressively.
        location /assets/ {
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Reverse-proxy /api/* to the ASP.NET Core backend. Mirrors the Vite
        # dev-server proxy in web/vite.config.ts so the production-style stack
        # is reachable via a single origin. The variable in proxy_pass makes
        # nginx evaluate the upstream lazily, so the web image still starts
        # cleanly when no api service is reachable (container-smoke case).
        location /api/ {
            set $api_upstream "http://api:8080";
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SignalR (planned for Phase 1) needs websocket upgrade.
        location /hub/ {
            set $hub_upstream "http://api:8080";
            proxy_pass $hub_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # SPA fallback — anything not matched goes to index.html for client routing.
        location / {
            add_header Cache-Control "no-store" always;
            try_files $uri /index.html;
        }
    }
}
