name: dwbhub

services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  web:
    image: node:22-alpine
    working_dir: /repo
    command: >-
      sh -c "corepack enable
      && corepack prepare pnpm@11.1.3 --activate
      && pnpm install --frozen-lockfile
      && pnpm --filter dwbhub-web dev --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE: http://api:8080
    ports: !override
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ../../:/repo
      - /repo/node_modules
      - /repo/web/node_modules
