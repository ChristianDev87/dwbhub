# Requires Docker Compose v2.24+ (the `!override` tag was introduced in v2.24).
# Compose v2.20 only supports `!reset`, which on our installed Compose v5.1.3
# behaves unexpectedly (drops the list entirely without applying the block-sequence
# replacement). For CI (ubuntu-24.04) this is unproblematic — its default Compose
# binary is well past v2.24. For older operator environments, upgrade Compose or
# remove this dev override file and roll your own dev workflow.
name: dwbhub

services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  web:
    # CRITICAL: must !reset the inherited `build:` from base compose.yml.
    # Without this, `docker compose build` builds Dockerfile.web (nginx runtime
    # stage) AND tags the result with the `image:` name below, silently
    # poisoning the upstream tag in the local docker cache. The container then
    # starts the nginx entrypoint and our `sh -c "npm..."` CMD lands in nginx,
    # giving the misleading "sh: npm: not found" error.
    build: !reset null
    image: node:22-bookworm-slim
    pull_policy: always
    working_dir: /repo
    command: >-
      sh -c "npm install -g pnpm@11.1.3
      && pnpm install --frozen-lockfile
      && pnpm --filter dwbhub-web dev --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE: http://api:8080
      # Vite's dev-server proxy target. Inside this container, `localhost:5080`
      # routes back to the web container itself (where nothing listens), so the
      # /api/* and /hub/* proxy rules need an explicit container-network target.
      DWBHUB_PROXY_API_TARGET: http://api:8080
    ports: !override
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ../../:/repo
      - /repo/node_modules
      - /repo/web/node_modules
