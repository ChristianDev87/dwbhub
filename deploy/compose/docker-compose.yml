name: dwbhub

x-common-env: &common-env
  DWBHUB_PUBLIC_URL: ${DWBHUB_PUBLIC_URL:-http://localhost:5173}
  DWBHUB_ALLOWED_ORIGINS: ${DWBHUB_ALLOWED_ORIGINS:-http://localhost:5173}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dwbhub}
      POSTGRES_USER: ${POSTGRES_USER:-dwbhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwbhub_dev_pw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-dwbhub}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailhog:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    image: dwbhub-api:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      <<: *common-env
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DWBHUB_DB_CONNECTION: ${DWBHUB_DB_CONNECTION:-Host=postgres;Port=5432;Database=dwbhub;Username=dwbhub;Password=dwbhub_dev_pw}
      DWBHUB_SMTP_HOST: ${DWBHUB_SMTP_HOST:-mailhog}
      DWBHUB_SMTP_PORT: ${DWBHUB_SMTP_PORT:-1025}
      DWBHUB_SMTP_FROM: ${DWBHUB_SMTP_FROM:-DwbHub <noreply@dwbhub.local>}
      DWBHUB_JWT_SECRET: ${DWBHUB_JWT_SECRET}
      DWBHUB_ENCRYPTION_KEY: ${DWBHUB_ENCRYPTION_KEY}
    ports:
      - "${API_PORT:-5080}:8080"
    volumes:
      - api-logs:/app/logs
      - api-data:/data/dwbhub

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    image: dwbhub-web:local
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:8080"

volumes:
  pg-data:
  api-logs:
  # api-data is pinned to a literal docker volume name (no project-prefix) so
  # docker-compose.test.yml's e2e-tests service can mount the SAME volume read-only
  # at /api-bootstrap-ro. Without the explicit name, the test compose file would
  # try to find dwbhub_api-data while the base compose creates <project>_api-data
  # under whatever project name happens to be active (depends on COMPOSE_PROJECT_NAME
  # or the compose-file's parent directory). Plan 0.8.4 Task 6 hit this on the
  # CI runner where the volume did not yet exist as dwbhub_api-data.
  api-data:
    name: dwbhub_api-data
