components:
  schemas:
    AddGuildRequest:
      required:
        - discordGuildId
        - displayName
      type: object
      properties:
        discordGuildId:
          minLength: 1
          pattern: '^\d{17,20}$'
          type: string
        displayName:
          maxLength: 100
          minLength: 1
          type: string
      additionalProperties: false
    BackfillStatusItem:
      type: object
      properties:
        jobId:
          type: integer
          format: int64
        status:
          type: string
          nullable: true
        fetchedCount:
          type: integer
          format: int32
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    BackfillStatusResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/BackfillStatusItem'
      additionalProperties: false
    ChannelListItem:
      type: object
      properties:
        publicId:
          type: string
          format: uuid
        discordChannelId:
          type: integer
          format: int64
        name:
          type: string
          nullable: true
        channelType:
          type: integer
          format: int32
        position:
          type: integer
          format: int32
        isBridged:
          type: boolean
        bridgedAt:
          type: string
          format: date-time
          nullable: true
        lastSyncedAt:
          type: string
          format: date-time
        backfill:
          $ref: '#/components/schemas/BackfillStatusItem'
      additionalProperties: false
    ChannelListResponse:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChannelListItem'
          nullable: true
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
      additionalProperties: false
    PasswordResetConfirmRequest:
      type: object
      properties:
        token:
          type: string
          nullable: true
        newPassword:
          type: string
          nullable: true
      additionalProperties: false
    PasswordResetRequestRequest:
      type: object
      properties:
        tenantSlug:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: { }
    PutBotCredentialsRequest:
      required:
        - token
      type: object
      properties:
        token:
          minLength: 1
          pattern: '^[A-Za-z0-9._-]{50,200}$'
          type: string
      additionalProperties: false
    SendMessageRequest:
      required:
        - content
      type: object
      properties:
        content:
          maxLength: 2000
          minLength: 1
          type: string
      additionalProperties: false
    SetupCompleteRequest:
      type: object
      properties:
        bootstrapToken:
          type: string
          nullable: true
        tenantName:
          type: string
          nullable: true
        tenantSlug:
          type: string
          nullable: true
        tenantLocale:
          type: string
          nullable: true
        ownerEmail:
          type: string
          nullable: true
        ownerDisplayName:
          type: string
          nullable: true
        ownerPassword:
          type: string
          nullable: true
      additionalProperties: false
    TestEditRequest:
      type: object
      properties:
        content:
          type: string
          nullable: true
      additionalProperties: false
    TestInjectReceivedRequest:
      type: object
      properties:
        channelPublicId:
          type: string
          format: uuid
