components:
  schemas:
    AddGuildRequest:
      required:
        - discordGuildId
        - displayName
      type: object
      properties:
        discordGuildId:
          minLength: 1
          pattern: '^\d{17,20}$'
          type: string
        displayName:
          maxLength: 100
          minLength: 1
          type: string
      additionalProperties: false
    BackfillStatusItem:
      type: object
      properties:
        jobId:
          type: integer
          format: int64
        status:
          type: string
          nullable: true
        fetchedCount:
          type: integer
          format: int32
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    BackfillStatusResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/BackfillStatusItem'
      additionalProperties: false
    BridgeCreatedResponse:
      type: object
      properties:
        backfillJobId:
          type: integer
          format: int64
      additionalProperties: false
    ChannelListItem:
      type: object
      properties:
        publicId:
          type: string
          format: uuid
        discordChannelId:
          type: integer
          format: int64
        name:
          type: string
          nullable: true
        channelType:
          type: integer
          format: int32
        position:
          type: integer
          format: int32
        isBridged:
          type: boolean
        bridgedAt:
          type: string
          format: date-time
          nullable: true
        lastSyncedAt:
          type: string
          format: date-time
        backfill:
          $ref: '#/components/schemas/BackfillStatusItem'
      additionalProperties: false
    ChannelListResponse:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChannelListItem'
          nullable: true
      additionalProperties: false
    DashboardResponse:
      type: object
      properties:
        tenantId:
          type: integer
          format: int64
        tenantSlug:
          type: string
          nullable: true
        tenantName:
          type: string
          nullable: true
        locale:
          type: string
          nullable: true
      additionalProperties: false
    EditMessageRequest:
      required:
        - content
      type: object
      properties:
        content:
          maxLength: 1800
          minLength: 1
          type: string
      additionalProperties: false
    EditMessageResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        publicId:
          type: string
          format: uuid
        authorName:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        sentAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
          nullable: true
        viaDwbhub:
          type: boolean
        discordMessageId:
          type: integer
          format: int64
      additionalProperties: false
    EditWindowExpiredResponse:
      type: object
      properties:
        error:
          type: string
          nullable: true
        retryAfterSeconds:
          type: integer
          format: int32
      additionalProperties: false
    GuildListResponse:
      type: object
      properties:
        guilds:
          type: array
          items:
            $ref: '#/components/schemas/GuildResponse'
          nullable: true
      additionalProperties: false
    GuildResponse:
      type: object
      properties:
        publicId:
          type: string
          format: uuid
        discordGuildId:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        isActive:
          type: boolean
        registeredAt:
          type: string
          format: date-time
        botCredentialsConfigured:
          type: boolean
        botConnectionState:
          type: string
          nullable: true
      additionalProperties: false
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        uptime_seconds:
          type: integer
          format: int64
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
      additionalProperties: false
    ManualReconnectCoolDownResponse:
      type: object
      properties:
        error:
          type: string
          nullable: true
        retryAfterSeconds:
          type: integer
          format: int32
      additionalProperties: false
    MeResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        tenantId:
          type: integer
          format: int64
        tenantSlug:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
      additionalProperties: false
    MessageHistoryItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        publicId:
          type: string
          format: uuid
        authorName:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        sentAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
          nullable: true
        viaDwbhub:
          type: boolean
        discordMessageId:
          type: integer
          format: int64
      additionalProperties: false
    MessageHistoryResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageHistoryItem'
          nullable: true
        nextBefore:
          type: integer
          format: int64
          nullable: true
      additionalProperties: false
    PasswordResetConfirmRequest:
      type: object
      properties:
        token:
          type: string
          nullable: true
        newPassword:
          type: string
          nullable: true
      additionalProperties: false
    PasswordResetConfirmResponse:
      type: object
      properties:
        reset:
          type: boolean
        sessionsRevoked:
          type: integer
          format: int32
      additionalProperties: false
    PasswordResetRequestRequest:
      type: object
      properties:
        tenantSlug:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
