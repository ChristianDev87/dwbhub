openapi: 3.0.1
info:
  title: DwbHub API
  version: v1
paths:
  '/api/tenants/{slug}/auth/login':
    post:
      tags:
        - Auth
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
  /api/auth/verify-email/resend:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailResendRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailResendRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/VerifyEmailResendRequest'
      responses:
        '200':
          description: OK
  /api/auth/verify-email/confirm:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailConfirmRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailConfirmRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/VerifyEmailConfirmRequest'
      responses:
        '200':
          description: OK
  /api/auth/password-reset/request:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
      responses:
        '200':
          description: OK
  /api/auth/password-reset/confirm:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: OK
  /api/auth/refresh:
    post:
      tags:
        - Auth
      responses:
        '200':
          description: OK
  /api/auth/logout:
    post:
      tags:
        - Auth
      responses:
        '200':
          description: OK
  '/api/t/{slug}/guilds/{guildPublicId}/bot-credentials':
    put:
      tags:
        - BotCredentials
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: guildPublicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutBotCredentialsRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/PutBotCredentialsRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PutBotCredentialsRequest'
      responses:
        '200':
          description: OK
    delete:
      tags:
        - BotCredentials
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: guildPublicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  '/api/t/{slug}/guilds':
    post:
      tags:
        - Guilds
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddGuildRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AddGuildRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AddGuildRequest'
      responses:
        '200':
          description: OK
    get:
      tags:
        - Guilds
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  '/api/t/{slug}/guilds/{publicId}':
    delete:
      tags:
        - Guilds
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: publicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  '/api/t/{slug}/guilds/{publicId}/activate':
    post:
      tags:
        - Guilds
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: publicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/t/{slug}/guilds/{publicId}/deactivate':
    post:
      tags:
        - Guilds
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: publicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/t/{slug}/guilds/{publicId}/bot/reconnect':
    post:
      tags:
        - Guilds
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: publicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/health:
    get:
      tags:
        - Health
      responses:
        '200':
          description: OK
  /api/setup/status:
    get:
      tags:
        - Setup
      responses:
        '200':
          description: OK
  /api/setup/complete:
    post:
      tags:
        - Setup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupCompleteRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/SetupCompleteRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SetupCompleteRequest'
      responses:
        '200':
          description: OK
  '/api/t/{slug}/dashboard':
    get:
      tags:
        - TenantDashboard
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  '/api/t/{slug}/me':
    get:
      tags:
        - TenantMe
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
components:
  schemas:
    AddGuildRequest:
      required:
        - discordGuildId
        - displayName
      type: object
      properties:
        discordGuildId:
          minLength: 1
          pattern: '^\d{17,20}$'
          type: string
        displayName:
          maxLength: 100
          minLength: 1
          type: string
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
      additionalProperties: false
    PasswordResetConfirmRequest:
      type: object
      properties:
        token:
          type: string
          nullable: true
        newPassword:
          type: string
          nullable: true
      additionalProperties: false
    PasswordResetRequestRequest:
      type: object
      properties:
        tenantSlug:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: { }
    PutBotCredentialsRequest:
      required:
        - token
      type: object
      properties:
        token:
          minLength: 1
          pattern: '^[A-Za-z0-9._-]{50,200}$'
          type: string
      additionalProperties: false
    SetupCompleteRequest:
      type: object
      properties:
        bootstrapToken:
          type: string
          nullable: true
        tenantName:
          type: string
          nullable: true
        tenantSlug:
          type: string
          nullable: true
        tenantLocale:
          type: string
          nullable: true
        ownerEmail:
          type: string
          nullable: true
        ownerDisplayName:
          type: string
          nullable: true
        ownerPassword:
          type: string
          nullable: true
      additionalProperties: false
    VerifyEmailConfirmRequest:
      type: object
      properties:
        token:
          type: string
          nullable: true
      additionalProperties: false
    VerifyEmailResendRequest:
      type: object
      properties:
        tenantSlug:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
      additionalProperties: false