openapi: 3.0.1
info:
  title: DwbHub API
  version: v1
paths:
  '/api/tenants/{slug}/auth/login':
    post:
      tags:
        - Auth
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
  /api/auth/verify-email/resend:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailResendRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailResendRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/VerifyEmailResendRequest'
      responses:
        '200':
          description: OK
  /api/auth/verify-email/confirm:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailConfirmRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailConfirmRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/VerifyEmailConfirmRequest'
      responses:
        '200':
          description: OK
  /api/auth/password-reset/request:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
      responses:
        '200':
          description: OK
  /api/auth/password-reset/confirm:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: OK
  /api/auth/refresh:
    post:
      tags:
        - Auth
      responses:
        '200':
          description: OK
  /api/auth/logout:
    post:
      tags:
        - Auth
      responses:
        '200':
          description: OK
  /api/health:
    get:
      tags:
        - Health
      responses:
        '200':
          description: OK
  /api/setup/status:
    get:
      tags:
        - Setup
      responses:
        '200':
          description: OK
  /api/setup/complete:
    post:
      tags:
        - Setup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupCompleteRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/SetupCompleteRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SetupCompleteRequest'
      responses:
        '200':
          description: OK
  '/api/t/{slug}/dashboard':
    get:
      tags:
        - TenantDashboard
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  '/api/t/{slug}/me':
    get:
      tags:
        - TenantMe
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
components:
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
      additionalProperties: false
    PasswordResetConfirmRequest:
      type: object
      properties:
        token:
          type: string
          nullable: true
        newPassword:
          type: string
          nullable: true
      additionalProperties: false
    PasswordResetRequestRequest:
      type: object
      properties:
        tenantSlug:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
      additionalProperties: false
    SetupCompleteRequest:
      type: object
      properties:
        bootstrapToken:
          type: string
          nullable: true
        tenantName:
          type: string
          nullable: true
        tenantSlug:
          type: string
          nullable: true
        tenantLocale:
          type: string
          nullable: true
        ownerEmail:
          type: string
          nullable: true
        ownerDisplayName:
          type: string
          nullable: true
        ownerPassword:
          type: string
          nullable: true
      additionalProperties: false
    VerifyEmailConfirmRequest:
      type: object
      properties:
        token:
          type: string
          nullable: true
      additionalProperties: false
    VerifyEmailResendRequest:
      type: object
      properties:
        tenantSlug:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
      additionalProperties: false